name: PROBE fork-secret

# Measurement instrument only. This file is NOT part of the target under test.
# Purpose: record, per event, whether (a) an externally-authored fork PR can reach
# a runner at all, and (b) whether repository secrets are provisioned to that run.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: report
        env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "PROBE event=${{ github.event_name }}"
          echo "PROBE actor=${{ github.actor }}"
          echo "PROBE head_repo=${{ github.event.pull_request.head.repo.full_name }}"
          echo "PROBE is_fork=${{ github.event.pull_request.head.repo.fork }}"
          echo "PROBE key_len=${#K}"
          echo "PROBE key_sha=$(printf %s "$K" | sha256sum | cut -c1-16)"
